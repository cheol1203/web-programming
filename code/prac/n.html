<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            display: inline-block;
            background-color: red;
            color: white;
            height: 50px;
            width: 50px;
            text-align: center;
            border: 1px solid lightgrey;
        }
        #h:hover{
            position: relative;
            left: -20px;
            top: -20px;
            background-color: green;
        }
        #k:hover{
            position: relative;
            right: 20px;
            bottom: 20px;
            background: green;
        }
    </style>
</head>
<body>
    <h3>상ㅈ대 배치, relative</h3>
    h와 k 글자에 마우스를 올려보세요
    <hr>
    <div>T</div>
    <div id="h">h</div>
    <div>a</div>
    <div>n</div>
    <div id="k">k</div>
    <div>s</div>
</body>
</html>
