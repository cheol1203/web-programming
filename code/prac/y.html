<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes a{
            from{font-size: 500%; display: block;}
            to{font-size: 100%; display: inline;}
        }
        h3{
            animation-name: a;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            border-style: solid;
        }
    </style>
</head>
