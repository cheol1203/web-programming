<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #menubar{
            background: olive;
        }
        #menubar ul{
            margin: 0;
            padding: 0;
            width: 567px;
        }
        ul li{
            display: inline-block;
            list-style-type: none;
            padding: 0px 15px;
            border-style: solid;
        }
        a{
            text-decoration: none;
            color: white;
        }
        a:hover{
            color: violet;
        }
    </style>
</head>
<body>
    <nav id="menubar">
        <ul>
            <li><a href="">home</a></li>
            <li><a href="">espresso</a></li>
            <li><a href="">capuccino</a></li>
            <li><a href="">cafe latte</a></li>
            <li><a href="">f a q</a></li>
        </ul>
    </nav>
</body>
</html>
