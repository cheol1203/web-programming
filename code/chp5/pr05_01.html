<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        div{
            display: inline;
            /* width: 200px; */
            border: 1px solid green;
        }
    </style>
  </head>
  <body>
    <h3>3개의 div 활용</h3>
    <div>
      이제 HTML에서 img 요소를 작성하는 것처럼 자바스크립트에서 src를 넣어서
      이미지의 경로를 작성해주면 된다.
    </div>
    <div>
      여기서 알아야 할 점은 이미지는 외부 데이터이기 때문에 로딩될 시간이
      필요하다. 캔버스에 그리려면 이 데이터가 다 있어야 하기 때문에 이미지가
      로드되는 것을 기다렸다가 끝나면 가져와야 한다.
    </div>
    <div>
      이미지가 다 로드되는 것을 기다리려면 앞서 만든 이미지 객체에
      이벤트리스너를 load로 달아주면 된다. 이후 실행될 작업을 작성하면 되는데
      이미지를 그려줘야 하기 때문에 drawImage()를 사용하면 된다.
    </div>
  </body>
</html>
