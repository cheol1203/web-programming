<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>갬블링 게임</title>
    <style>
      .num {
        display: inline-block;
        background-color: papayawhip;
        color: navy;
        font-size: 3em;
        width: 60px;
        text-align: center;
        border: 2px solid palevioletred;
        margin: 5px;
      }
      #result {
        margin-top: 15px;
        font-size: 0.9em;
      }
    </style>

    <script>
      let count = 0;
      let finished = false;

      function changeNum(obj) {
        if (finished) return;

        let n = Math.floor(Math.random() * 3);
        obj.innerHTML = n;

        count++;

        if (count === 3) {
          finished = true;

          let n1 = document.getElementById("n1").innerHTML;
          let n2 = document.getElementById("n2").innerHTML;
          let n3 = document.getElementById("n3").innerHTML;
          let res = document.getElementById("result");

          if (n1 === n2 && n2 === n3) {
            res.style.color = "blue";
            res.innerHTML = "Success(click here to do again)";
          } else {
            res.style.color = "red";
            res.innerHTML = "fail(click here to do again)";
          }
        }
      }

      function resetGame() {
        count = 0;
        finished = false;
        document.getElementById("n1").innerHTML = "0";
        document.getElementById("n2").innerHTML = "0";
        document.getElementById("n3").innerHTML = "0";
        document.getElementById("result").innerHTML = "";
      }
    </script>
  </head>

  <body>
    <h3>갬블링 게임</h3>
    <p>
      각 숫자를 클릭하면 0에서 2사이의 난수로 바뀝니다. 모두 같은 수가 나오면
      승리합니다.
    </p>
    <hr>
    <span id="n1" class="num" onclick="changeNum(this)">0</span>
    <span id="n2" class="num" onclick="changeNum(this)">0</span>
    <span id="n3" class="num" onclick="changeNum(this)">0</span>
    <p id="result" onclick="resetGame()"></p>
  </body>
</html>
