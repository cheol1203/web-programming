<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>라면을 끓이는 순서</h2>
    <hr>
    <ol type="A" style="background-color: yellowgreen;" onclick="addItem();">
        <li>물을 끓인다</li>
    </ol>
    <script>
        let ol = document.querySelector('ol');
        function addItem(){
            let user=prompt('라면을 끓이는 순서를 입력하세요');
            if(user){
                let newItem=document.createElement('li');
                newItem.innerHTML = user;
                ol.appendChild(newItem);
            }
        }
    </script>
</body>
</html>
