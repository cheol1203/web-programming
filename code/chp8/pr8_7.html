<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>클릭하면 90도 회전합니다</h2>
    <hr>
    <img src="../../media/sponge.webp" width="150" style="margin-left: 50px;">
    <script>
        let img=document.querySelector('img');
        let curDeg = 0;
        img.onclick = function(){
            curDeg = (curDeg + 90) % 360;
            this.style.transform=`rotate(${curDeg}deg)`;
        }
    </script>
</body>
</html>
