<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            position: relative;
        }
        img{
            position: absolute;
        }
    </style>
</head>
<body>
    <h2>z-index 스타일 프러퍼티</h2>
    <hr>
    <div>
        <img src="../../media/spadeA.png" width="200" style="z-index: 0;">
        <img src="../../media/spade3.png" width="200" style="z-index: 1;">
        <img src="../../media/spade7.png" width="200" style="z-index: 2;">
    </div>
    <script>
        let imgs=document.querySelectorAll('img');
        for(const img of imgs){
            img.onclick = function(){
                for(const img2 of imgs){
                    img2.style.zIndex = (img2.style.zIndex + 1) % 3;
                }
            }
        }
    </script>
</body>
</html>
