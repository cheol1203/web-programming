<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 30px;
            height: 30px;
        }
        div{
            position: absolute;
        }
    </style>
</head>
<body>
    <h3>이미지 커서 만들기</h3>
    <hr>
    마우스를 움직이면 이미지로 만든 커서가 마우스를 따라 다닙니다
    <div id="div">
        <img src="../../media/apple.jpg" alt="">
    </div>
    <script>
        let a=document.getElementById("div");
        window.onmousemove=function(e){
            a.style.left=e.clientX + "px";
            a.style.top=e.clientY + "px";
        }
    </script>
</body>
</html>
