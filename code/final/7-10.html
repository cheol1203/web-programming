<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>book 객체 배열 만들기</h3>
    <hr>
    <script>
        let bookArray = new Array(5);
        for(let i =0; i<bookArray.length;i++){
            let n = prompt("콤마(,)로 분리하면서 책제목 저자 가격 순으로 입력")
            let array=n.split(",");
            let book = new Object();
            book.title=array[0];
            book.author=array[1];
            book.price=parseInt(array[2]);
            bookArray[i]=book;

        }

        for(let i=0; i<bookArray.length; i++){
            document.write(bookArray[i].title + "," + bookArray[i].author + "," + bookArray[i].price + "<br>");
        }

        let max = bookArray[0].price;
        let index = 0;
        for(let i=1; i<bookArray.length; i++){
            if(bookArray[i].price>max){
                max=bookArray[i].price; //max 갱신해줘야함!!
                index = i;
            }
        }
        
        document.write("<hr>");

        document.write("가장 가격이 비싼 책은 " + bookArray[index].title);

    </script>
</body>
</html>
