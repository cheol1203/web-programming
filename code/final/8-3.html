<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>visibility 프로퍼티</title>
    <style>
        h3{
            display: inline-block;
        }
      span {
        visibility: hidden;
      }
    </style>
    <script>
        let visible="hidden";
        let a = document.getElementsByTagName("span");
        function d(){
            if(visible=="visible"){
                visible="hidden";
            }else if(visible=="hidden"){
                visible="visible";
            }
            for(let i=0;i<a.length;i++){
                a[i].style.visibility=visible;
            }
            
            
        }
    </script>
  </head>
  <body>
    <h3>다음 빈 곳에 숨은 단어?</h3>
    <button onclick="d()">show/hide</button>
    <hr />
    <ul>
      <li>I (<span>love</span>) you.</li>
      <li>CSS is Cascading (<span>Style</span>) Sheet.</li>
      <li>응답하라 (<span>1988</span>).</li>
    </ul>
    
  </body>
</html>
