<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>라디오 버튼을 클릭하면 이미지를 출력합니다.</h3>
    <hr>
    <form>
        <input type="radio" name="fruit" onclick="f('banana')" checked>바나나
        <input type="radio" name="fruit" onclick="f('mango')">망고
        <input type="radio" name="fruit" onclick="f('apple')">사과
    </form>
    <img src="../../media/banana.jpg" id="a" alt="">
    <script>
        let b = document.getElementById('a');
        function f(text){
            if(text=='banana'){
                b.src="../../media/banana.jpg";
            }else if(text=='apple'){
                b.src="../../media/apple.jpg";
            }else if(text=='mango'){
                b.src="../../media/mango.jpg";
            }
        }
    </script>
</body>
</html>
