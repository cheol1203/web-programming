<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            display: inline-block;
            width: 150px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h3>16개의 랜덤한 색 만들기</h3>
    <hr>
    <script>
        let r = [];
        let g = [];
        let b = [];
        let color = [];
        for(let i =0;i<16;i++){
            r[i]= Math.floor(Math.random()*256)
            g[i]= Math.floor(Math.random()*256)
            b[i]= Math.floor(Math.random()*256)
            color[i] = "rgb(" + r[i] + "," + g[i] + "," + b[i] + ")";
        }
        for(let i = 0; i<16; i++){
            document.write("<div style='background-color: " + color[i] + ";'>"  + color[i]+ "</div>")
        }
    </script>
</body>
</html>
