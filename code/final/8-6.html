<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>innerHTML</h3>
    <hr>
    <p id="par" onclick="add()">이번 여름에는 어디로 여행을 갈까요?</p>
    <script>
        let b = document.getElementById('par');
        function add(){
            let a = prompt("입력하세요");
            b.innerHTML=a;
            
        }
    </script>
</body>
</html>
